name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SQLITE_VERSION: "3460100"
  SQLITE_VERSION_LABEL: "3.46.1"
  SQLITE_YEAR: "2024"
  SQLITE_DIR: third_party/sqlite
  BUILD_IMAGE: ubuntu:18.04

jobs:
  build:
    name: linux-aarch64-glibc-2.27
    runs-on: ubuntu-24.04
    env:
      CC: aarch64-linux-gnu-gcc
      TARGET: cellmgrd-linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Ubuntu 18.04 cross toolchain
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e SQLITE_VERSION="$SQLITE_VERSION" \
            -e SQLITE_VERSION_LABEL="$SQLITE_VERSION_LABEL" \
            -e SQLITE_YEAR="$SQLITE_YEAR" \
            -e SQLITE_DIR="$SQLITE_DIR" \
            -e CC="$CC" \
            -e TARGET="$TARGET" \
            -v "$PWD:/work" \
            -w /work \
            "$BUILD_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update || {
                sed -i "s|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g" /etc/apt/sources.list
                sed -i "s|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g" /etc/apt/sources.list
                apt-get update
              }
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                gcc-aarch64-linux-gnu \
                libc6-dev-arm64-cross \
                linux-libc-dev-arm64-cross \
                curl \
                unzip \
                file \
                binutils

              strings /usr/aarch64-linux-gnu/lib/libc.so.6 \
                | grep "^GLIBC_2\\." \
                | sort -V \
                | tail -1 \
                | grep -x "GLIBC_2.27"

              mkdir -p "$SQLITE_DIR" .deps
              curl -fL "https://www.sqlite.org/${SQLITE_YEAR}/sqlite-amalgamation-${SQLITE_VERSION}.zip" -o .deps/sqlite.zip
              unzip -q .deps/sqlite.zip -d .deps
              cp ".deps/sqlite-amalgamation-${SQLITE_VERSION}/sqlite3.c" "$SQLITE_DIR/"
              cp ".deps/sqlite-amalgamation-${SQLITE_VERSION}/sqlite3.h" "$SQLITE_DIR/"
              grep -E "#define SQLITE_VERSION[[:space:]]+\"${SQLITE_VERSION_LABEL}\"" "$SQLITE_DIR/sqlite3.h"

              make clean TARGET="$TARGET"
              make \
                CC="$CC" \
                TARGET="$TARGET" \
                USE_BUNDLED_SQLITE=1 \
                SQLITE_DIR="$SQLITE_DIR"
              file "$TARGET"
            '

      - name: Package artifact
        run: |
          mkdir -p dist
          cp "$TARGET" dist/
          cp config/cellmgrd.conf dist/
          cp profiles/fm650.json dist/
          tar -C dist -czf "dist/${TARGET}.tar.gz" "$TARGET" cellmgrd.conf fm650.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cellmgrd-linux-aarch64
          path: dist/cellmgrd-linux-aarch64.tar.gz
